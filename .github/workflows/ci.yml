name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday run so the pipeline is re-verified until the deadline
  workflow_dispatch:

jobs:
  test:
    name: lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests app report notebooks
      - run: uv run mlda-download
      - run: uv run pytest -m "not slow"

  lock-and-exports:
    name: lock file and exported requirements are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: |
          # the first two lines of an export are a comment naming the output path, so compare the rest
          uv export --format requirements-txt --all-groups --no-hashes --no-emit-project -o /tmp/req.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)
          uv export --format requirements-txt --no-dev --no-hashes --no-emit-project -o /tmp/app-req.txt
          diff -u <(grep -v '^#' app/requirements.txt) <(grep -v '^#' /tmp/app-req.txt)
        shell: bash

  pip-fresh-venv:
    name: plain pip install from requirements.txt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: python -c "import mlda; print(mlda.__version__)"
      - run: mlda-download   # extracts the committed archives after verifying their SHA-256
      - run: pytest -m "not slow" -k "not app_smoke"

  notebook:
    name: execute the notebook end to end
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run mlda-download   # extracts the committed archives, verifies SHA-256
      - name: slow tests (notebook execution, quick study run)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -m slow -rA --tb=long --durations=10 2>&1 | tee slow-tests.log
      - name: publish the failure details in the job summary
        if: failure()
        shell: bash
        run: |
          { echo '## Slow tests: last 150 log lines'; echo '```'; tail -n 150 slow-tests.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # annotations are visible without signing in; GitHub keeps at most ten per step
          grep -n -E "^(FAILED|ERROR) |Error:|Error|assert |Traceback|Timeout|timed out|Killed|MemoryError" slow-tests.log | tail -n 10 | while IFS= read -r line; do
            echo "::error title=slow tests::${line//%/%25}"
          done
          tail -n 3 slow-tests.log | while IFS= read -r line; do echo "::warning title=slow tests tail::${line//%/%25}"; done
      - name: keep the failure log on a throwaway branch (anonymous readers cannot open job logs)
        if: failure()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci-logs && cp slow-tests.log /tmp/ci-logs/slow-tests.log
          cd /tmp/ci-logs && git init -q -b ci-logs && git config user.name ci-logs && git config user.email ci-logs@users.noreply.github.com
          git add slow-tests.log && git commit -q -m "slow-test log of ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs:ci-logs

  docker:
    name: docker build + health check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mlda-cw1 .
      - run: |
          docker run -d --rm -p 8501:8501 --name mlda mlda-cw1
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then echo "healthy"; exit 0; fi
            sleep 3
          done
          docker logs mlda; exit 1
